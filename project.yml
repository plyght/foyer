name: Foyer
options:
  bundleIdPrefix: app.foyer
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES
packages:
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: "8.2.0"
  Luminare:
    url: https://github.com/MrKai77/Luminare
    revision: 7958d31
  Vortex:
    url: https://github.com/twostraws/Vortex
    from: "1.0.0"
targets:
  Foyer:
    type: application
    platform: macOS
    sources:
      - path: Foyer
      - path: Shared
    dependencies:
      - package: Defaults
      - package: Luminare
      - package: Vortex
      - target: FoyerHelper
        embed: true
        codeSign: true
      - sdk: EventKit.framework
      - sdk: IOKit.framework
      - sdk: CoreAudio.framework
      - sdk: ScriptingBridge.framework
    info:
      path: Foyer/App/Info.plist
      properties:
        CFBundleName: Foyer
        CFBundleDisplayName: Foyer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSHumanReadableCopyright: "Foyer is free and open source."
        NSPrincipalClass: NSApplication
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: Foyer.sdef
        CFBundleURLTypes:
          - CFBundleURLName: app.foyer.Foyer
            CFBundleURLSchemes: [foyer]
        NSAppleEventsUsageDescription: "Foyer controls Music, Spotify and your browser to show and control what is playing."
        NSCalendarsFullAccessUsageDescription: "Foyer shows your upcoming events in the notch."
        NSCalendarsUsageDescription: "Foyer shows your upcoming events in the notch."
        NSBluetoothAlwaysUsageDescription: "Foyer shows the battery of your AirPods and other connected devices."
        NSLocationWhenInUseUsageDescription: "Foyer uses your location for weather and time-to-leave alerts."
        NSLocationUsageDescription: "Foyer uses your location for weather and time-to-leave alerts."
        NSAudioCaptureUsageDescription: "Foyer needs your permission to display the live waveform."
    entitlements:
      path: Foyer/App/Foyer.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.device.bluetooth: true
        com.apple.security.device.audio-input: true
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.foyer.Foyer
        PRODUCT_NAME: Foyer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  FoyerHelper:
    type: xpc-service
    platform: macOS
    sources:
      - path: FoyerHelper
      - path: Shared
    info:
      path: FoyerHelper/Info.plist
      properties:
        CFBundleName: FoyerHelper
        CFBundleDisplayName: FoyerHelper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        XPCService:
          ServiceType: Application
    settings:
      base:
        # Mirrors Alcove's helper: MediaRemote only answers allow-listed Apple
        # bundle ids on macOS 15.4+, so the helper carries a com.apple id.
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.controlcenter.FoyerHelper
        PRODUCT_NAME: FoyerHelper
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../Frameworks"
schemes:
  Foyer:
    build:
      targets:
        Foyer: all
        FoyerHelper: all
    run:
      config: Debug
    archive:
      config: Release
