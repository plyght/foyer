name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Toolchain
        run: sw_vers && xcodebuild -version && xcrun --show-sdk-version

      - name: Report all compile errors per run
        run: defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Foyer.xcodeproj -scheme Foyer

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Foyer.xcodeproj \
            -scheme Foyer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | xcbeautify --renderer github-actions || \
          (grep -E "error:|warning: .*will be an error" build.log | sort -u | head -400; exit 1)

      - name: Package
        run: |
          APP="build/Build/Products/Release/Foyer.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Foyer.zip
          shasum -a 256 Foyer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Foyer
          path: Foyer.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Foyer.zip
          generate_release_notes: true
